# Builds the Android wrapper around fav.html.
# - pull requests / manual runs: debug APK as a workflow artifact
# - tags v*: signed release APK attached to the GitHub Release (picked up by Komi Store, Obtainium, IzzyOnDroid)
name: Android

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['android/**', 'fav.html', 'clock.js', 'lib/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        if: env.RELEASE == 'true'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -nE "s/^ *versionName *= *'([^']+)'.*/\1/p" android/app/build.gradle)
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but versionName is $have"; exit 1; }

      - name: Decode signing key
        if: env.RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.YACLOCK_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::secret YACLOCK_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "YACLOCK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          YACLOCK_KEYSTORE_PASSWORD: ${{ secrets.YACLOCK_KEYSTORE_PASSWORD }}
          YACLOCK_KEY_ALIAS: ${{ secrets.YACLOCK_KEY_ALIAS }}
          YACLOCK_KEY_PASSWORD: ${{ secrets.YACLOCK_KEY_PASSWORD }}
        run: |
          if [ "$RELEASE" = true ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/YAClock-$GITHUB_REF_NAME.apk"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/YAClock-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/*.apk

      - name: Publish release
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/YAClock-${{ github.ref_name }}.apk
          generate_release_notes: true
